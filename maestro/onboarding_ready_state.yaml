appId: ${APP_ID}
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      OPENCLAW_UI_TEST_MODE: 1
      OPENCLAW_UI_TEST_SCENARIO: ${OPENCLAW_UI_TEST_SCENARIO}
      OPENCLAW_UI_TEST_DISABLE_AUDIO: 1
- assertVisible:
    id: "porch.chat.list"
- assertVisible:
    id: "porch.chat.new"
- takeScreenshot: "porch-ready-state"
